<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 140" width="100%" height="100%">
  <defs>
    <filter id="glow3" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>
  <!-- 3 Bottles forming the '3' shape -->
  <g transform="translate(150, 48)" filter="url(#glow3)">
    <!-- Top red curve/cap -->
    <path d="M-28,-36 C-10,-48 15,-45 28,-30 C38,-18 35,-4 22,2 C10,8 0,8 -8,5" fill="none" stroke="#e62534" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Middle dark connector with bottle silhouette -->
    <path d="M-8,5 C10,8 24,12 28,24 C34,40 18,52 -6,52 C-22,52 -34,42 -36,30" fill="none" stroke="#1d2340" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Center bottle inner elements -->
    <rect x="-6" y="-22" width="12" height="20" rx="3" fill="#ffffff" />
    <rect x="-4" y="-30" width="8" height="8" rx="2" fill="#e62534" />
    <rect x="-6" y="8" width="12" height="22" rx="3" fill="#ffffff" />
  </g>
  <!-- Text '3SISTERS' -->
  <text x="150" y="122" font-family="'Montserrat', 'Impact', sans-serif" font-weight="900" font-size="28" fill="#ffffff" text-anchor="middle" letter-spacing="3">
    <tspan fill="#e62534">3</tspan><tspan fill="#ffffff">SISTERS</tspan>
  </text>
  <text x="150" y="136" font-family="'Montserrat', sans-serif" font-weight="700" font-size="10" fill="#aaaaaa" text-anchor="middle" letter-spacing="4">DRINKS</text>
</svg>
