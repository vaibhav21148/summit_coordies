<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 120" width="100%" height="100%">
  <defs>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7cd636" />
      <stop offset="50%" stop-color="#4ea822" />
      <stop offset="100%" stop-color="#2a7010" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="4" stdDeviation="3" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>
  <!-- Background leaves mosaic circle -->
  <g transform="translate(150, 60)" filter="url(#shadow)">
    <circle cx="0" cy="0" r="48" fill="url(#leafGrad)" opacity="0.95" />
    <!-- Leaf patterns -->
    <path d="M-30,-20 Q-15,-40 0,-25 Q15,-40 30,-20 Q40,0 25,20 Q0,35 -25,20 Z" fill="#9be848" opacity="0.5" />
    <path d="M-20,-10 Q0,-30 20,-10 Q30,10 10,25 Q-10,30 -20,10 Z" fill="#bcf56a" opacity="0.6" />
  </g>
  <!-- Text 'Wakao' -->
  <text x="150" y="70" font-family="'Arial Rounded MT Bold', 'Montserrat', 'Poppins', sans-serif" font-weight="900" font-size="44" fill="#ffffff" stroke="#1d420c" stroke-width="4" paint-order="stroke fill" text-anchor="middle" letter-spacing="1">Wakao</text>
  <text x="150" y="98" font-family="'Montserrat', sans-serif" font-weight="800" font-size="13" fill="#ffffff" text-anchor="middle" letter-spacing="4">FOODS</text>
</svg>
