  <div class="contact-card-container pt-5 pb-5" style="position: relative; z-index: 100;">
    <h2 class="contact-section-heading">For Sponsorship Opportunities</h2>
    <div class="contact">
      @for(member of markiData; track $index){
      <app-square-contact [contact]="member.contact" [email]="member.mail"
        [linkedin]="member.linkedin" [img_url]="member.profile" [name]="member.name"
        [designation]="member.designation"></app-square-contact>
      }
    </div>
    <h2 class="contact-section-heading">For Media Associations</h2>
    <div class="contact">
      @for(member of mediaData; track $index){
      <app-square-contact [contact]="member.contact" [email]="member.mail"
        [linkedin]="member.linkedin" [img_url]="member.profile" [name]="member.name"
        [designation]="member.designation"></app-square-contact>
      }
    </div>
  </div>
