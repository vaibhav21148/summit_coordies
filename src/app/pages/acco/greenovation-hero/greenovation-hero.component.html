<section id="hero">
  <!-- Background Glow Image -->
  <img src="images/backgrounds/abt.png" class="orange-glow-bg" alt="Glow Background" draggable="false">

  <div class="hero-text">

    <!-- Staggered Circular Images -->
    <div class="acco-circles">
      <div class="line-left"></div>
      <div class="line-center"></div>
      <div class="line-right"></div>

      <div class="circle-img circle-1">
        <img src="images/acco/acco1.png" alt="Accommodation 1">
      </div>
      <div class="circle-img circle-2">
        <img src="images/acco/acco2.png" alt="Accommodation 2">
      </div>
      <div class="circle-img circle-3">
        <img src="images/acco/acco3.png" alt="Accommodation 3">
      </div>
      <div class="circle-img circle-4">
        <img src="images/acco/acco4.png" alt="Accommodation 4">
      </div>
    </div>

    <h1 class="heading-primary gradient-title title" style="margin-bottom: 1rem;" data-aos="zoom-in"
      data-aos-delay="300">
      ACCOMMODATION
    </h1>

    <p class="hero-description" data-aos="fade-up" data-aos-delay="600">
      We're thrilled to host you at E-Summit'26, IIT Bombay - Asia's largest buisness conclave.
      Stay at the heart of E-Summit 2026 and immerse yourself in the entrepreneurial ecosystem.
    </p>

    <p class="hero-description" data-aos="fade-up" data-aos-delay="600">
      <a href="https://maps.app.goo.gl/wU72CFpCkpGpkbN7A" target="_blank" style="text-decoration: none; color: white;">
        <span style="font-weight: 500; font-size: 1.3rem;">Stay Inside IIT Bombay Campus</span>
      </a>
    </p>

    <div class="hero-buttons" data-aos="fade-up" data-aos-delay="800">
      <a (click)="bookAccommodation()" class="btn-modern" style="cursor: pointer;">Book Accommodation</a>
      <a routerLink="/dashboard/accommodation" class="btn-modern">Go to dashboard</a>
    </div>
  </div>

  <div class="scroll-indicator" data-aos="fade-up" data-aos-delay="1200">
    <a (click)="scrollToSection('info')" class="scroll-link">
      <span class="scroll-text">Scroll Down</span>
      <svg class="scroll-arrow" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 14l-7 7m0 0l-7-7m7 7V3"></path>
      </svg>
    </a>
  </div>
</section>



<!-- Info section anchor for smooth scrolling -->
<div id="info" style="position: relative; top: -60px;"></div>
