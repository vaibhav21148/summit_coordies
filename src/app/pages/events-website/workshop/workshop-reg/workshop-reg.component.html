<div class="reg-form">
  <div class="left-side">
    <img src="https://2k21.s3.amazonaws.com/s3uploadapi/workshop_logo.png" alt="Workshop Logo" class="logo">
    <div class="content">
      <h1>Workshop Registration</h1>
      <p>Complete Registration</p>
    </div>
    <div class="steps">
      <div class="step active">
        <div class="circle">1</div>
        <p>Registration</p>
      </div>
    </div>
  </div>
  
  <div class="right-side">
    <div class="form-content">
      <div class="form-step">
        <form *ngIf="workshopForm && !isLoading" [formGroup]="workshopForm" (ngSubmit)="onSubmit()">
          <div class="form-group">
            <label>Name *</label>
            <input type="text" formControlName="name" placeholder="Enter your name" required>
          </div>
          
          <div class="form-group">
            <label>Email *</label>
            <input type="email" formControlName="email" placeholder="Enter your email" required>
          </div>
          
          <div class="form-group">
            <label>Contact (WhatsApp preferred) *</label>
            <input type="tel" formControlName="contact" placeholder="Enter Your Contact Number" required>
            <div *ngIf="workshopForm.get('contact')?.invalid && workshopForm.get('contact')?.touched" class="error-message">
              Please enter a valid 10-digit phone number
            </div>
          </div>
          
          <div class="form-group">
            <label>Workshops *</label>
            <div class="radio-group">
              <div class="radio-option" *ngFor="let option of workshopOptions">
                <input type="radio" 
                       [id]="option.tag"
                       [value]="option.tag + ' - ' + option.viewValue"
                       formControlName="workshop"
                       name="workshop">
                <label [for]="option.tag">{{ option.tag }} - {{ option.viewValue }} - ₹ {{option.price}}</label>
              </div>
            </div>
          </div>
          
          <div class="form-group">
            <label>Discount Code (Optional)</label>
            <input type="text" formControlName="coupon_code" placeholder="Have a Discount code? Enter here" style="text-transform: uppercase">
          </div>

          <div class="form-actions">
            <button type="submit" [disabled]="!workshopForm.valid || isSubmitting" class="submit-btn">
              {{isSubmitting ? 'Processing...' : 'Register & Pay'}}
            </button>
          </div>
        </form>
        <div *ngIf="!workshopForm || isLoading" class="loading">Loading...</div>
      </div>
    </div>
  </div>
</div>
